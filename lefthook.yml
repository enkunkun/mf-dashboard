pre-commit:
  commands:
    # 機密情報・個人情報（特にホーム配下の絶対パス）の混入を止める。
    # スクリプトが無い環境（他のコントリビュータ）では何もしない。
    redact:
      run: '[ -x "$HOME/.ai-shared/hooks/redact-check.sh" ] && bash "$HOME/.ai-shared/hooks/redact-check.sh" {staged_files} || true'
    format:
      glob: "*.{ts,tsx,js,jsx,json,css,yml,yaml,md}"
      run: pnpm oxfmt {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{ts,tsx,js,jsx}"
      run: pnpm oxlint --type-aware --fix {staged_files}
      stage_fixed: true
    knip:
      glob: "*.{ts,tsx,js,jsx}"
      run: pnpm knip --fix
      stage_fixed: true

post-merge:
  commands:
    clean-wal:
      run: rm -f data/*.db-shm data/*.db-wal

post-checkout:
  commands:
    clean-wal:
      run: rm -f data/*.db-shm data/*.db-wal
